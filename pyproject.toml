[project]
name = "ai-trading-platform"
version = "0.1.0"
description = "AI-powered personal investment assistant"
requires-python = ">=3.9"
readme = "README.md"

[tool.uv.workspace]
members = [
  "packages/shared",
  "services/api_gateway",
  "services/news_intelligence",
  "services/company_announcements",
  "services/geopolitical",
  "services/macro",
  "services/sentiment",
  "services/market_data",
  "services/prediction",
  "services/llm_reasoning",
  "services/risk",
  "services/execution",
  "services/portfolio",
  "services/learning",
  "services/backtesting",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "testcontainers>=4.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "packages", "services"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
