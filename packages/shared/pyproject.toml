[project]
name = "ai-trading-shared"
version = "0.1.0"
description = "Shared domain kernel, security, config, and infrastructure ports"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "redis>=5.0",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt>=4.0,<4.1",
  "cryptography>=43.0",
  "httpx>=0.27",
  "structlog>=24.4",
  "orjson>=3.10",
  "tenacity>=8.5",
  "prometheus-client>=0.20",
  "eval_type_backport>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_trading_shared"]
