name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: make install
      - name: Test
        run: make test
        env:
          APP_ENV: test
          SECRET_KEY: ci-test-secret
          USE_MOCK_NEWS: "true"
          USE_MOCK_LLM: "true"
          ENABLE_LIVE_TRADING: "false"
          EXECUTION_MODE: paper
