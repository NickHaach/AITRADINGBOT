services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./infra/db/migrations/002_market_graph_outcomes.sql:/docker-entrypoint-initdb.d/002_market_graph_outcomes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d ai_trading"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api_gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api_gateway
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://trading:trading_dev_password@postgres:5432/ai_trading
      REDIS_URL: redis://redis:6379/0
      PORTFOLIO_SERVICE_URL: http://portfolio:8008
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      portfolio:
        condition: service_started

  news_intelligence:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.news_intelligence
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://trading:trading_dev_password@postgres:5432/ai_trading
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      USE_MOCK_NEWS: "true"
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  news_worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.news_intelligence
    command: celery -A news_intelligence.workers.celery_app.celery_app worker --beat --loglevel=INFO
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      USE_MOCK_NEWS: "true"
    depends_on:
      redis:
        condition: service_healthy

  market_data:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.market_data
    env_file: .env
    environment:
      USE_MOCK_MARKET_DATA: "true"
      DATABASE_URL: postgresql+asyncpg://trading:trading_dev_password@postgres:5432/ai_trading
      ENABLE_SQL_PERSISTENCE: "true"
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  company_announcements:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.company_announcements
    env_file: .env
    ports:
      - "8003:8003"

  learning:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.learning
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://trading:trading_dev_password@postgres:5432/ai_trading
      ENABLE_SQL_PERSISTENCE: "true"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      REDIS_URL: redis://redis:6379/0
      MODEL_ARTIFACT_DIR: /app/artifacts
    ports:
      - "8007:8007"
    volumes:
      - model_artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  learning_worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.learning
    command: celery -A learning.workers.celery_app.celery_app worker --beat --loglevel=INFO
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://trading:trading_dev_password@postgres:5432/ai_trading
      ENABLE_SQL_PERSISTENCE: "true"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      REDIS_URL: redis://redis:6379/0
      MODEL_ARTIFACT_DIR: /app/artifacts
    volumes:
      - model_artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  portfolio:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.portfolio
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://trading:trading_dev_password@postgres:5432/ai_trading
      ENABLE_SQL_PERSISTENCE: "true"
      USE_MOCK_MARKET_DATA: "true"
      REDIS_URL: redis://redis:6379/0
      MODEL_ARTIFACT_DIR: /app/artifacts
    ports:
      - "8008:8008"
    volumes:
      - model_artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.4
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_NEWS_URL: http://localhost:8001
      NEXT_PUBLIC_MARKET_URL: http://localhost:8002
      NEXT_PUBLIC_ANN_URL: http://localhost:8003
      NEXT_PUBLIC_PORTFOLIO_URL: http://localhost:8008
    depends_on:
      - api_gateway
      - news_intelligence

volumes:
  postgres_data:
  qdrant_data:
  model_artifacts:
