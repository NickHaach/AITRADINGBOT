[project]
name = "llm-reasoning"
version = "0.1.0"
description = "LLM Reasoning Engine"
requires-python = ">=3.9"
dependencies = ["ai-trading-shared", "httpx>=0.27"]

[tool.uv.sources]
ai-trading-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_reasoning"]
