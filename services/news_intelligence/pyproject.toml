[project]
name = "news-intelligence"
version = "0.1.0"
description = "News Intelligence Engine — ingest, classify, embed financial news"
requires-python = ">=3.9"
dependencies = [
  "ai-trading-shared",
  "fastapi>=0.112",
  "uvicorn[standard]>=0.30",
  "celery[redis]>=5.4",
  "httpx>=0.27",
  "qdrant-client>=1.11",
  "numpy>=1.26",
]

[project.optional-dependencies]
embeddings = [
  "sentence-transformers>=3.0",
]

[tool.uv.sources]
ai-trading-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_intelligence"]
