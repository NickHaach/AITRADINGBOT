[project]
name = "company-announcements"
version = "0.1.0"
description = "Company Announcement Engine — filings, earnings, impact scoring"
requires-python = ">=3.9"
dependencies = [
  "ai-trading-shared",
  "fastapi>=0.112",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]

[tool.uv.sources]
ai-trading-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_announcements"]
