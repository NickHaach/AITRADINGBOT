[project]
name = "backtesting-engine"
version = "0.1.0"
description = "Backtesting Engine — historical replay and strategy evaluation"
requires-python = ">=3.9"
dependencies = [
  "ai-trading-shared",
  "fastapi>=0.112",
  "uvicorn[standard]>=0.30",
  "numpy>=1.26",
]

[tool.uv.sources]
ai-trading-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtesting"]
