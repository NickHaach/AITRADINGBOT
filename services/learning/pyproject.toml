[project]
name = "learning-engine"
version = "0.1.0"
description = "Learning Engine — outcome tracking and model feedback"
requires-python = ">=3.9"
dependencies = [
  "ai-trading-shared",
  "fastapi>=0.112",
  "uvicorn[standard]>=0.30",
  "celery>=5.4",
]

[tool.uv.sources]
ai-trading-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning"]
