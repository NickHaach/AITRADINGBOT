[project]
name = "prediction-engine"
version = "0.1.0"
description = "Prediction Engine"
requires-python = ">=3.9"
dependencies = ["ai-trading-shared"]

[tool.uv.sources]
ai-trading-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prediction"]
